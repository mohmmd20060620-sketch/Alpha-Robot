<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Robot | تواصل معنا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="Alpha Robot Logo">
                <span>Alpha Robot</span>
            </a>

            <button class="menu-toggle" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
            </button>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="services.html">خدماتنا</a></li>
                <li><a href="about.html">من نحن</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
            </ul>
        </div>
    </header>

    <div class="container" style="margin-top: 130px;">
        <h2 class="section-title">تواصل معنا</h2>
        
        <form class="contact-form" id="contactForm">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" required placeholder="أدخل اسمك">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" required placeholder="alpha.robot.io@gmail.com">
            </div>
            <div class="form-group">
                <label>الرسالة</label>
                <textarea rows="5" required placeholder="كيف يمكننا مساعدتك؟"></textarea>
            </div>
            <button type="submit" class="btn" style="width: 100%; justify-content: center;">إرسال الرسالة</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Alpha Robot Software Development. جميع الحقوق محفوظة.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
